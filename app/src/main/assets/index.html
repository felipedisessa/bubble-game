<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#001423" />
  <title>Estoura Bolhas — 30s</title>
  <meta name="description" content="Estoure o máximo de bolhas em 30 segundos.">
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" as="image" href="gif_oceano.gif">
  <script src="game.js" defer></script>
</head>
<body>
  <div id="game" aria-label="Jogo Estoura Bolhas" role="application">
    <div class="hud" aria-live="polite">
      <div class="pill" id="timePill">⏱️ <span class="value" id="time">30</span>s</div>
      <div class="pill" id="scorePill">🫧 <span class="value" id="score">0</span></div>

      <!-- Barra de progresso dentro do HUD (quebra para a 2ª linha em telas pequenas) -->
      <div class="goal-wrap" aria-label="Progresso da meta">
        <div class="goal-head">
          🎯 <span id="goalCount">0</span>/<span id="goalTotal">100</span>
        </div>
        <div class="goal-bar">
          <div class="goal-fill" id="goalFill"></div>
          <div class="goal-knob" id="goalKnob" aria-hidden="true">💛</div>
        </div>
      </div>
    </div>

    <!-- Overlay Inicial -->
    <div class="overlay" id="startOverlay" aria-hidden="false">
      <div class="card">
        <h1>Estoure o máximo de bolhas em <strong>30s</strong>!</h1>
        <p class="subtitle">Use <strong>multitouch</strong> — dois, três, quatro dedos… quantos conseguir!</p>
        <div class="actions">
          <button class="btn" id="startBtn" type="button">Começar</button>
        </div>
      </div>
    </div>

    <!-- Overlay de Contagem Regressiva -->
    <div class="overlay" id="countOverlay" hidden aria-hidden="true">
      <div class="card count-card" aria-live="assertive">
        <div id="countNum" class="count-num">3</div>
      </div>
    </div>

    <!-- Overlay Final -->
    <div class="overlay" id="endOverlay" hidden aria-hidden="true">
      <div class="card final">
        <h2>Tempo esgotado!</h2>
        <div class="score" id="finalScore">0</div>
        <div class="highscore" id="highscoreTxt">Recorde: 0</div>
        <div class="actions">
          <button class="btn" id="restartBtn" type="button">Jogar novamente</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
